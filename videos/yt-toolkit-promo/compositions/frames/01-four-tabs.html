  <script>
    (function () {
      var FRAME_ID = "01-four-tabs";
      var DURATION = 4.459;

      // one job per VO cue — the four clause windows of the narration line
      var TOKENS = ["tags.", "titles.", "thumbnails.", "math."];
      var CUES = [0, 1.16, 2.26, 3.36];

      var wordEl = document.getElementById("four-tabs-word");
      var numEl = document.getElementById("four-tabs-num");

      // discrete-text-sequence: reverse-search the sparse state array — the display
      // jumps at each threshold with NO tween between states (the hard cut IS the
      // motion; any easing here would smear the cut into a fade).
      function stateAt(t) {
        for (var i = CUES.length - 1; i >= 0; i--) {
          if (t >= CUES[i]) return i;
        }
        return -1;
      }
      function renderState(t) {
        var i = stateAt(t);
        var token = i < 0 ? "" : TOKENS[i];
        var num = i < 0 ? "" : (i + 1 < 10 ? "0" + (i + 1) : String(i + 1));
        if (wordEl.textContent !== token) wordEl.textContent = token;
        if (numEl.textContent !== num) numEl.textContent = num;
      }
      renderState(0); // frame 0 is correct before the engine's first seek

      var tl = gsap.timeline({ paused: true });

      // the swap engine — one driver runs the whole shot; both the centred token
      // and the mono catalogue numeral are read out of the same state array
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            renderState(driver.t);
          },
        },
        0,
      );

      // mono chrome settles in on the opening beat
      tl.fromTo(
        "#four-tabs-counter",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.06,
      );

      // the ornament draws on beneath the word
      tl.fromTo(
        ".four-tabs-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.34, ease: "power3.out" },
        0.26,
      );

      // the rail — one hairline tab card lands per job, on its own cue
      var BASE = 140;
      var RAIL_LOOSE = 68; // 58px card + a 10px gap that the next card's nub tucks into
      var RAIL_TIGHT = 64; // the pile huddles: 4px nub tuck, cards visibly crammed
      var CASCADE_LOOSE = 9;
      var CASCADE_TIGHT = 2;
      var ARRIVE = [0.2, 1.22, 2.26, 3.42];
      var TIGHTEN_AT = 3.46;

      var cards = gsap.utils.toArray(".four-tabs-card");
      cards.forEach(function (card, i) {
        var isLast = i === cards.length - 1;
        var looseY = BASE + RAIL_LOOSE * i;
        var tightY = BASE + RAIL_TIGHT * i;
        var looseX = CASCADE_LOOSE * i;
        var tightX = CASCADE_TIGHT * i;
        // the last tab lands already inside the tight pile; the earlier three
        // huddle together beneath it when it arrives
        var endY = isLast ? tightY : looseY;
        var endX = isLast ? tightX : looseX;

        tl.fromTo(
          card,
          { scale: 0, opacity: 0, x: endX, y: endY - 46 },
          {
            scale: 1,
            opacity: 1,
            x: endX,
            y: endY,
            duration: 0.44,
            ease: "back.out(1.2)", // low overshoot — the packet's "drops in" settle
          },
          ARRIVE[i],
        );

        if (!isLast) {
          tl.to(
            card,
            { x: tightX, y: tightY, duration: 0.44, ease: "power3.out" },
            TIGHTEN_AT,
          );
        }
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
      tl.seek(0);
    })();
