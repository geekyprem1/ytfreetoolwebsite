    (function () {
      var FRAME_ID = "05-tool-crawl";
      var DUR = 3.307;

      var world = document.getElementById("f05-world");
      var track = document.getElementById("f05-track");
      var counterEl = document.getElementById("f05-counter");
      var tagEl = document.getElementById("f05-tag");

      /* ------------------------------------------------------------------
         The camera — viewport-change's single-wrapper form.
         screen(p) = worldCentre + T + S * (p - worldCentre); solving for the
         frame centre (960, 540) gives T = -S * (target - worldCentre) plus the
         constant recentre (540 - 1853). One cam object, one writer.
         ------------------------------------------------------------------ */
      var WC_Y = 1853;
      var BASE_Y = 540 - WC_Y; /* -1313 */

      /* measured card centres in WORLD coords (plate y minus the 2549 crop origin) */
      var CARD1 = 436; /*  Thumbnail Downloader      · Downloaders    */
      var CARD2 = 1892; /* Video Statistics          · Analytics      */
      var CARD3 = 3089; /* YouTube Money Calculator  · Calculators    */

      function poseFor(cardY, s) {
        return { scale: s, x: 0, y: BASE_Y - s * (cardY - WC_Y) };
      }
      var POSE1 = poseFor(CARD1, 1.0);
      var POSE2 = poseFor(CARD2, 0.94);
      var POSE3 = poseFor(CARD3, 0.96);

      /* the HUD rig rides the same legs: seeded on card 1, translated to 2 and 3 */
      var TRACK2 = CARD2 - CARD1; /* 1456 */
      var TRACK3 = CARD3 - CARD1; /* 2653 */

      var cam = { scale: POSE1.scale, x: POSE1.x, y: POSE1.y };

      /* multi-phase-camera's continuous micro-drift, composed in the same writer.
         X and Y run at different frequencies (~1.3) so the path is an organic
         Lissajous, not a mechanical diagonal. */
      var drift = { p: 0, amp: 1 };
      var DRIFT_CYCLES = 1.5;
      var DRIFT_AX = 4;
      var DRIFT_AY = 2.5;
      var DRIFT_RATIO = 1.3;

      function applyCamera() {
        var dx = Math.sin(drift.p) * DRIFT_AX * drift.amp;
        var dy = Math.sin(drift.p * DRIFT_RATIO) * DRIFT_AY * drift.amp;
        world.style.transform =
          "translate(" +
          (cam.x + dx).toFixed(3) +
          "px, " +
          (cam.y + dy).toFixed(3) +
          "px) scale(" +
          cam.scale +
          ")";
      }
      applyCamera(); /* seed frame 0 */

      /* ------------------------------------------------------------------
         Discrete chrome — the section counter and the reticle's group tag step
         through sparse state arrays with no tween (the hard swap IS the motion),
         read out of one seek-safe driver.
         ------------------------------------------------------------------ */
      var COUNTER = [
        [0, "01 / 03"],
        [1.05, "02 / 03"],
        [1.95, "03 / 03"],
      ];
      var TAGS = [
        [0, "Downloaders"],
        [1.1, "Analytics"],
        [2.05, "Calculators"],
      ];
      function pick(list, t) {
        var v = list[0][1];
        for (var i = 1; i < list.length; i++) if (t >= list[i][0]) v = list[i][1];
        return v;
      }
      function renderHud(t) {
        var c = pick(COUNTER, t);
        var g = pick(TAGS, t);
        if (counterEl.textContent !== c) counterEl.textContent = c;
        if (tagEl.textContent !== g) tagEl.textContent = g;
      }
      renderHud(0);

      var tl = gsap.timeline({ paused: true });

      function countTo(el, to, at, dur, fmt) {
        var o = { v: 0 };
        tl.to(
          o,
          {
            v: to,
            duration: dur,
            ease: "power2.out",
            onUpdate: function () {
              el.textContent = fmt(o.v);
            },
          },
          at,
        );
      }
      function int(v) {
        return Math.round(v).toLocaleString("en-US");
      }

      /* full-span drivers */
      var hud = { t: 0 };
      tl.to(
        hud,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            renderHud(hud.t);
          },
        },
        0,
      );
      tl.to(drift, { p: Math.PI * 2 * DRIFT_CYCLES, duration: DUR, ease: "none", onUpdate: applyCamera }, 0);

      /* ------------------------------------------------------------------
         Scene 1 (0.00-0.60) — ink field; the plate at scale 1.0 on the
         Downloaders rows. The reticle locks on around the Thumbnail Downloader

        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },

        "#f05-pip",
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },

      var TIER_AT = [0.34, 0.44, 0.54];
      var tierRows = document.querySelectorAll(".f05-pip-a .f05-row");
      var tierTicks = document.querySelectorAll(".f05-pip-a .f05-tick");
      Array.prototype.forEach.call(tierRows, function (row, i) {
        var at = TIER_AT[i];
        tl.fromTo(
          row.querySelector(".f05-lab"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" },

        );
        tl.fromTo(
          tierTicks[i],
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2)" },
          at + 0.04,
        );
      });

      /* ------------------------------------------------------------------
         Scene 2 (0.60-1.50) — "Check the stats." The camera pulls back
         1.0 -> 0.94 and pans down the world to the Analytics rows on one
         power2.inOut repositioning leg; the reticle + pip ride it down onto
         Video Statistics; the pip swaps to the stats readout and its

        cam,
        { scale: POSE2.scale, y: POSE2.y, duration: 0.72, ease: "power2.inOut", onUpdate: applyCamera },
        0.6,
      );
      tl.to(track, { y: TRACK2, duration: 0.72, ease: "power2.inOut" }, 0.6);

        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        1.16,

      countTo(document.getElementById("f05-views"), 12480, 1.24, 0.55, int);
      countTo(document.getElementById("f05-likes"), 962, 1.3, 0.5, int);
      countTo(document.getElementById("f05-comments"), 214, 1.36, 0.46, int);

      /* ------------------------------------------------------------------
         Scene 3 (1.50-2.80) — "Count the earnings." The pan continues to the
         YouTube Calculators rows on a hard power4.out arrival (fast commit,
         long settle); the reticle lands on YouTube Money Calculator and the
         pip swaps to the RPM / CPM label column + a count-up $ figure.
         ------------------------------------------------------------------ */
      tl.to(
        cam,
        { scale: POSE3.scale, y: POSE3.y, duration: 0.85, ease: "power4.out", onUpdate: applyCamera },
        1.5,
      );
      tl.to(track, { y: TRACK3, duration: 0.85, ease: "power4.out" }, 1.5);

      tl.to(".f05-pip-b", { opacity: 0, duration: 0.24, ease: "power2.in" }, 1.92);
      tl.fromTo(
        ".f05-pip-c",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        2.14,
      );

      countTo(document.getElementById("f05-earn"), 1248, 2.28, 0.58, function (v) {
        return "$" + int(v);
      });

      /* ------------------------------------------------------------------
         Scene 4 (2.80-3.307) — landing settle. Travel has stopped on the
         calculators cluster; the micro-drift eases down to near-imperceptible
         and the frame holds. No exit tween.
         ------------------------------------------------------------------ */
      tl.to(drift, { amp: 0.42, duration: DUR - 2.8, ease: "power2.out" }, 2.8);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
      tl.seek(0);
    })();
  </script>
