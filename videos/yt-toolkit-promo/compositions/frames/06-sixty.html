  <script>
    (function () {
      const ROOT_ID = "06-sixty";
      const tl = gsap.timeline({ paused: true });

      const el = (id) => document.getElementById(id);

      /* ------------------------------------------------------------------
         Scene 1 (0.00-1.20) — fire field, nothing else. The hero 60 counts up
         while its transform scale grows 0.6 -> 1 (counting-dynamic-scale): the
         value tween and the scale tween share position, ease and duration, and
         the scale pivots on the number's bottom-left, so the mass rises into
         size instead of inflating. It sits translated dead-center-upper.
         ------------------------------------------------------------------ */
      const HERO_X = 856; // + xPercent -50 → ink centred on the 1920 frame
      const HERO_Y = 140; // drops the giant into the upper-centre band
      const HERO_SCALE = 0.6; // 320px finale × 0.6 = the stepped-back slot (192px)
      const LABEL_X = 677; // pins the label's left edge to the giant's ink edge

      tl.fromTo(
        ".f06-count60",
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "power2.out" },
        0.02,
      );

      const count60 = { value: 0 };
      tl.to(
        count60,
        {
          value: 60,
          duration: 1.0,
          ease: "power2.out",
          onUpdate: () => {
            el("f06-count60").textContent = Math.round(count60.value).toLocaleString();
          },
        },
        0.06,
      );
      tl.fromTo(
        ".f06-count60",
        { scale: 0.6 },
        { scale: 1, duration: 1.0, ease: "power2.out" },
        0.06,
      );

      // the label seats beneath the giant, left-aligned to its ink edge, and fades in early
      tl.fromTo(
        "#f06-label60",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.42,
      );

      /* ------------------------------------------------------------------
         Scene 2 (1.20-2.40) — the 60 steps back to scale 0.6 and holds the
         upper-left of the block; the label travels back with it. The 15 then
         counts up beneath, at 0.6 of the stepped-back hero size.
         ------------------------------------------------------------------ */
      tl.fromTo(
        ".f06-giant60",
        { x: HERO_X, xPercent: -50, y: HERO_Y, scale: 1 },
        {
          x: 0,
          xPercent: 0,
          y: 0,
          scale: HERO_SCALE,
          duration: 0.44,
          ease: "power3.out",
        },
        1.2,
      );
      tl.fromTo(
        ".f06-label-60",
        { x: LABEL_X, y: HERO_Y },
        { x: 0, y: 0, duration: 0.44, ease: "power3.out" },
        1.2,
      );

      tl.fromTo(
        ".f06-num15",
        { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.42,
      );
      const count15 = { value: 0 };
      tl.to(
        count15,
        {
          value: 15,
          duration: 0.85,
          ease: "power2.out",
          onUpdate: () => {
            el("f06-num15").textContent = Math.round(count15.value).toLocaleString();
          },
        },
        1.42,
      );
      tl.fromTo(
        ".f06-num15",
        { scale: 0.6 },
        { scale: 1, duration: 0.85, ease: "power2.out" },
        1.42,
      );
      tl.fromTo(
        "#f06-label15",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        1.7,
      );

      /* ------------------------------------------------------------------
         Scene 3 (2.40-3.20) — the 0 lands large beneath (one settle, no bounce),
         with its mono label and a small ink chip masked-sliding in beside it
         (clip-path inset sweep + a short x drift under the mask).
         ------------------------------------------------------------------ */
      tl.fromTo(
        ".f06-num0",
        { opacity: 0, scale: 0.5, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.52, ease: "power3.out" },
        2.48,
      );
      tl.fromTo(
        "#f06-label0",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        2.62,
      );

      tl.fromTo(
        ".f06-chip",
        { clipPath: "inset(0px 100% 0px 0px)", x: -18 },
        { clipPath: "inset(0px 0px 0px 0px)", x: 0, duration: 0.4, ease: "power3.out" },
        2.78,
      );
      tl.fromTo(
        "#f06-chipt",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        2.9,
      );

      /* ------------------------------------------------------------------
         Scene 4 (3.20-4.245) — the hero word free lands biggest of the block
         (spring-pop-entrance: scale 0 -> 1, smooth long-tail settle, no
         overshoot) with FOREVER beneath it. Stack resolved and still — hold
         to cut. No exit tween.
         ------------------------------------------------------------------ */

        ".f06-numfree",
        { opacity: 0, scale: 0, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        3.26,
      );
      tl.fromTo(

        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        3.52,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ROOT_ID] = tl;
